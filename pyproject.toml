[project]
name = "lightning-project-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "lightning>=2.5.2",
    "tensorboard>=2.20.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pyright>=1.1.414",
    "pytest>=8.4.1",
]

[tool.black]
target-version = ["py312"]

[tool.pyright]
include = ["loaders", "loss", "models", "scripts", "utils", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
