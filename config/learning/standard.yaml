# Target for learning params object
_target_: utils.learning.LearningParameters

# Echo model name
model_name: ${model_name}

# Learning parameters
learning_rate: 0.001
weight_decay: 0.001
batch_size: 128
grad_accumulation: 1
epochs: 20
beta_ema: 0.99
gradient_clip: 0.1
save_path: saved/
amp: False

# Data parameters
val_split: 0.05
test_split: 0.01

# Device parameters
devices: auto
num_workers: 8
pin_memory: True

# Monitoring (checkpointing, early stopping, plateau schedulers)
loss_monitor: "validation total loss"
trigger_loss: 0.00000001

# Scheduler parameters
interval: ${schedulers.module_params.interval}
frequency: ${schedulers.module_params.frequency}
